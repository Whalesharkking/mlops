name: Feature pipeline (daily)

# Started every day at 08:30 UTC by cron-job.org through the GitHub API (see README, Schedule).
# A GitHub cron is not used, because GitHub starts scheduled runs many hours late.
on:
  workflow_dispatch:

concurrency:
  group: feature-store
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --no-dev

      - name: Run feature pipeline for today
        run: uv run --no-dev python -m nectarflow.features.pipeline --wait-minutes 120
