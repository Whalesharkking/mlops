name: Feature pipeline (daily)

# Started at 08:30 UTC by cron-job.org (see README, Schedule). The cron is only a fallback.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 14 * * *"

concurrency:
  group: feature-store
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
    steps:
      - name: Skip the fallback if today's features exist
        id: today
        if: github.event_name == 'schedule'
        run: |
          day=$(TZ=Europe/Zurich date +%F)
          url="https://huggingface.co/datasets/$HF_DATASET_REPO/resolve/main/features/issue_date=$day.parquet"
          if curl -sfI -o /dev/null "$url"; then
            echo "features for $day are already in the store, nothing to do"
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.today.outputs.done != 'true'

      - uses: astral-sh/setup-uv@v10.3.0
        if: steps.today.outputs.done != 'true'
        with:
          enable-cache: true

      - name: Install locked dependencies
        if: steps.today.outputs.done != 'true'
        run: uv sync --locked --no-dev

      - name: Run feature pipeline for today
        if: steps.today.outputs.done != 'true'
        run: uv run --no-dev python -m nectarflow.features.pipeline --wait-minutes 120
